name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build, test and check code smells
        run: ./mvnw -B verify

      - name: Annotate PMD findings
        run: python3 .github/scripts/annotate_pmd.py
